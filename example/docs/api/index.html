<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample App API</title>
    <style>
        body { margin: 0; font-family: Inter, system-ui, -apple-system, sans-serif; }
        .pionia-docs-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.65rem 1rem;
            background: #3d104f;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .pionia-docs-toolbar-title { font-weight: 600; font-size: 0.95rem; }
        .pionia-docs-toolbar a {
            color: #fff;
            text-decoration: none;
            font-size: 0.875rem;
            padding: 0.35rem 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 999px;
        }
        .pionia-docs-toolbar a:hover { background: rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body>
<div class="pionia-docs-toolbar">
    <div style="display:flex;align-items:center;gap:0.5rem;">
        <img src="/__pionia/favicon.ico" alt="" width="24" height="24">
        <span class="pionia-docs-toolbar-title">Sample App API</span>
    </div>
    <a href="/">Home</a>
</div>
<script
    id="api-reference"
    data-url="openapi.json"
    data-configuration='{&quot;theme&quot;:&quot;purple&quot;,&quot;layout&quot;:&quot;modern&quot;,&quot;hideDownloadButton&quot;:false,&quot;darkMode&quot;:true}'></script>
<script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
<noscript>
    <p style="font-family: system-ui, sans-serif; padding: 2rem;">
        API docs require JavaScript. OpenAPI spec: <a href="openapi.json">openapi.json</a>
    </p>
</noscript>
</body>
</html>
