<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample App API</title>
    <style>
        body { margin: 0; font-family: Inter, system-ui, -apple-system, sans-serif; }
        .pionia-docs-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.65rem 1rem;
            background: #3d104f;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .pionia-docs-toolbar-title { font-weight: 600; font-size: 0.95rem; }
        .pionia-docs-toolbar a {
            color: #fff;
            text-decoration: none;
            font-size: 0.875rem;
            padding: 0.35rem 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 999px;
        }
        .pionia-docs-toolbar a:hover { background: rgba(255, 255, 255, 0.08); }
        .pionia-catalog-sidebar {
            position: fixed;
            z-index: 15;
            top: 3.55rem;
            bottom: 0;
            left: 0;
            width: 16rem;
            overflow-y: auto;
            border-right: 1px solid var(--scalar-border-color, rgba(127, 127, 127, 0.2));
            background: var(--scalar-background-1, #111318);
        }
        .pionia-service-navigation { display: flex; flex-direction: column; gap: 0.2rem; padding: 0.35rem; }
        .scalar-api-reference {
            width: calc(100% - 16rem) !important;
            margin-left: 16rem;
            --refs-sidebar-width: 0px;
        }
        .scalar-api-reference .t-doc__sidebar { display: none !important; }
        .pionia-service-version {
            padding: 0.65rem 0.55rem 0.25rem;
            color: var(--scalar-color-3, #777);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .pionia-service-navigation details { border-radius: 0.35rem; }
        .pionia-service-navigation summary {
            cursor: pointer;
            list-style: none;
            padding: 0.5rem 0.6rem;
            border-radius: 0.35rem;
            color: var(--scalar-color-1, inherit);
            font-size: 0.85rem;
            font-weight: 600;
        }
        .pionia-service-navigation summary::-webkit-details-marker { display: none; }
        .pionia-service-navigation summary::before {
            content: "›";
            display: inline-block;
            width: 1rem;
            transition: transform 0.12s ease;
        }
        .pionia-service-navigation details[open] > summary::before { transform: rotate(90deg); }
        .pionia-service-navigation summary:hover,
        .pionia-action-link:hover { background: var(--scalar-background-2, rgba(127, 127, 127, 0.1)); }
        .pionia-action-link {
            display: block;
            width: calc(100% - 1.2rem);
            margin-left: 1.2rem;
            padding: 0.4rem 0.55rem;
            border: 0;
            border-radius: 0.35rem;
            background: transparent;
            color: var(--scalar-color-2, inherit);
            cursor: pointer;
            font: inherit;
            font-size: 0.8rem;
            text-align: left;
        }
        .pionia-action-link.is-active {
            background: var(--scalar-background-2, rgba(127, 127, 127, 0.15));
            color: var(--scalar-color-1, inherit);
            font-weight: 600;
        }
        @media (max-width: 600px) {
            .pionia-catalog-sidebar { display: none; }
            .scalar-api-reference { width: 100% !important; margin-left: 0; }
        }
    </style>
</head>
<body>
<div class="pionia-docs-toolbar">
    <div style="display:flex;align-items:center;gap:0.5rem;">
        <img src="/__pionia/favicon.ico" alt="" width="24" height="24">
        <span class="pionia-docs-toolbar-title">Sample App API</span>
    </div>
    <a href="/">Home</a>
</div>
<aside class="pionia-catalog-sidebar" aria-label="API services and actions">
<div class="pionia-service-navigation"><div class="pionia-service-version">v1</div><details open><summary>auth</summary><button type="button" class="pionia-action-link" data-example-key="auth.create_auth" data-operation-index="0" title="Creates an auth record">create_auth</button><button type="button" class="pionia-action-link" data-example-key="auth.delete_auth" data-operation-index="0" title="Deletes an auth record">delete_auth</button><button type="button" class="pionia-action-link" data-example-key="auth.get_auth" data-operation-index="0" title="Returns auth context for the current request">get_auth</button><button type="button" class="pionia-action-link" data-example-key="auth.list_auth" data-operation-index="0" title="Lists auth records (demo stub)">list_auth</button><button type="button" class="pionia-action-link" data-example-key="auth.update_auth" data-operation-index="0" title="Updates an auth record">update_auth</button></details><details open><summary>category</summary><button type="button" class="pionia-action-link" data-example-key="category.list" data-operation-index="0" title="List all companies">list</button><button type="button" class="pionia-action-link" data-example-key="category.save_or_update" data-operation-index="0" title="Create or update a company row">save_or_update</button><button type="button" class="pionia-action-link" data-example-key="category.update" data-operation-index="0" title="Update a company by id">update</button></details><details open><summary>mail</summary><button type="button" class="pionia-action-link" data-example-key="mail.send_welcome" data-operation-index="0" title="Queued welcome email demo">send_welcome</button></details><details open><summary>sampolo</summary><button type="button" class="pionia-action-link" data-example-key="sampolo.create" data-operation-index="0" title="Create a new row">create</button><button type="button" class="pionia-action-link" data-example-key="sampolo.delete" data-operation-index="0" title="Delete a row by primary key">delete</button><button type="button" class="pionia-action-link" data-example-key="sampolo.details" data-operation-index="0" title="Alias for the `retrieve` action">details</button><button type="button" class="pionia-action-link" data-example-key="sampolo.edit" data-operation-index="0" title="Alias for the `update` action">edit</button><button type="button" class="pionia-action-link" data-example-key="sampolo.list" data-operation-index="0" title="List rows with optional pagination">list</button><button type="button" class="pionia-action-link" data-example-key="sampolo.random" data-operation-index="0" title="Return random row(s)">random</button><button type="button" class="pionia-action-link" data-example-key="sampolo.retrieve" data-operation-index="0" title="Fetch one row by primary key">retrieve</button><button type="button" class="pionia-action-link" data-example-key="sampolo.save" data-operation-index="0" title="Alias for the `create` action">save</button><button type="button" class="pionia-action-link" data-example-key="sampolo.update" data-operation-index="0" title="Update an existing row">update</button></details></div>
</aside>
<script
    id="api-reference"
    data-url="openapi.json"
    data-configuration='{&quot;theme&quot;:&quot;purple&quot;,&quot;layout&quot;:&quot;modern&quot;,&quot;hideDownloadButton&quot;:false,&quot;darkMode&quot;:true,&quot;hideModels&quot;:true,&quot;tagsSorter&quot;:&quot;alpha&quot;,&quot;operationsSorter&quot;:&quot;alpha&quot;,&quot;defaultOpenAllTags&quot;:false}'></script>
<script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
<script>
(function () {
    function chooseAction(button) {
        var key = button.getAttribute('data-example-key');
        var operationIndex = Number(button.getAttribute('data-operation-index') || 0);
        var pickers = document.querySelectorAll('[data-testid="example-picker"]');
        var picker = pickers[operationIndex] || pickers[0];
        if (!picker) {
            return;
        }

        picker.scrollIntoView({ behavior: 'smooth', block: 'center' });
        if (picker.getAttribute('aria-expanded') !== 'true') {
            picker.click();
        }

        window.setTimeout(function () {
            var options = Array.from(document.querySelectorAll('[role="option"]'));
            var option = options.find(function (item) {
                return (item.textContent || '').indexOf(key) !== -1;
            });
            if (option) {
                option.click();
            }
        }, 50);

        document.querySelectorAll('.pionia-action-link').forEach(function (item) {
            item.classList.toggle('is-active', item === button);
        });
    }

    document.querySelectorAll('.pionia-action-link').forEach(function (button) {
        button.addEventListener('click', function () {
            chooseAction(button);
        });
    });
})();
</script>
<noscript>
    <p style="font-family: system-ui, sans-serif; padding: 2rem;">
        API docs require JavaScript. OpenAPI spec: <a href="openapi.json">openapi.json</a>
    </p>
</noscript>
</body>
</html>
