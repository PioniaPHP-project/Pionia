[server]
NOT_FOUND_CODE=404
UNAUTHENTICATED_CODE=401
SERVER_ERROR_CODE=500

[logging]
LOG_REQUESTS=false
LOG_RESPONSES=false
LOGGED_SETTINGS=
LOG_FORMAT=TEXT
HIDE_IN_LOGS=password,pin,password2
HIDE_SUB=**********
LOG_HANDLERS=
LOG_PROCESSORS=

[exceptions]
DONT_REPORT=
RENDER_TRACES=true

; update the welcome page sections
[welcome]
HIDE_CONTEXT=false
HIDE_QUICK_START=false
HIDE_ENV=false
HIDE_PORT=false

[db]
database_type=sqlite
database_name=database.sqlite3
default=true

[db_pgsql]
database_type=pgsql
database_name=auther_db
username=root
password=
host=localhost
port=5432
connection_timeout=5

[app_middlewares]
request_id=Application\Middlewares\RequestIdMiddleware

[app_authentications]
demo=Application\Authentications\DemoAuthentication

[cors]
allowed_origins=http://localhost:4200
allowed_headers=*
credentials=true
max_age=10

; Runtime API docs (/docs, /docs/openapi.json, /api/v1/__catalog)
;[docs]
;ENABLED=false
;TOKEN=

; Developer stats dashboard (/stats, /stats.json) — separate token from docs
;[stats]
;ENABLED=false
;TOKEN=

; Application maintenance mode (503 for all HTTP routes except /__pionia assets)
;[maintenance]
;ENABLED=false
;MESSAGE=We are upgrading the platform and will be back soon.
;RETRY_AFTER=300
;BYPASS_TOKEN=maintenance-secret

; Runtime API docs (/docs, /docs/openapi.json, /api/v1/__catalog)
; [docs]
; ENABLED=true
; TOKEN=

; Developer stats dashboard (/stats, /stats.json) — separate token from docs
; [stats]
; ENABLED=true
; TOKEN=

; Request performance metrics (recorded to storage/metrics/requests.jsonl)
; Enabled when DEBUG or [stats] ENABLED; disable explicitly with:
; [metrics]
; ENABLED=false

; Request performance metrics (recorded to storage/metrics/requests.jsonl)
; Enabled when DEBUG or [stats] ENABLED; disable explicitly with:
; [metrics]
; ENABLED=false

; Cache store (PSR-16). Built-in: filesystem, array, null, database, apcu, redis
; [cache]
; STORE=filesystem
; TTL=3600

; Per-store options (section name: cache_<store> or cache.stores.<store> in PHP env)
; [cache_redis]
; host=127.0.0.1
; port=6379
; prefix=pionia:
; password=
; database=0

; [cache_database]
; connection=default
; table=cache

;Application maintenance mode (503 for all HTTP routes except /__pionia assets)
; [maintenance]
; ENABLED=false
; MESSAGE=We are upgrading the platform and will be back soon.
; RETRY_AFTER=300
; BYPASS_TOKEN=maintenance-secret