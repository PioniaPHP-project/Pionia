[server]
NOT_FOUND_CODE = 404
UNAUTHENTICATED_CODE = 401
SERVER_ERROR_CODE = 500

[logging]
LOG_REQUESTS = ""
LOG_RESPONSES = ""
LOGGED_SETTINGS = ""
LOG_FORMAT = TEXT
HIDE_IN_LOGS = "password,pin,password2"
HIDE_SUB = "**********"
LOG_HANDLERS = ""
LOG_PROCESSORS = ""

[exceptions]
DONT_REPORT = ""
RENDER_TRACES = 1

[welcome]
HIDE_CONTEXT = ""
HIDE_QUICK_START = ""
HIDE_ENV = ""
HIDE_PORT = ""

[db]
database_type = "sqlite"
database_name = "database.sqlite3"
default = 1

[db_pgsql]
database_type = "pgsql"
database_name = "auther_db"
username = "root"
password = ""
host = "localhost"
port = 5432
connection_timeout = 5

[app_middlewares]
request_id = "Application\Middlewares\RequestIdMiddleware"

[app_authentications]
demo = "Application\Authentications\DemoAuthentication"

[cors]
allowed_origins = "http://localhost:4200"
allowed_headers = "*"
credentials = 1
max_age = 10

[maintenance]
ENABLED = "false"

